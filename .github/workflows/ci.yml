name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # 1. Backend CI: Chạy Unit Test Spring Boot
  # ==========================================
  backend-test:
    name: Backend Unit Tests (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Chạy Unit Test Backend với Maven
        run: mvn clean test

      - name: Xuất báo cáo kết quả Test (Surefire Report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  # ==========================================
  # 2. Frontend CI: Chạy Unit Test React
  # ==========================================
  frontend-test:
    name: Frontend Unit Tests (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt dependencies
        run: npm ci

      - name: Chạy Unit Test Frontend
        run: npm test -- --watchAll=false --coverage

